plugins {
    id "java-library"
    id "idea"
    id "maven-publish"
    id "net.neoforged.gradle.userdev" version "7.0.182"
}

version = "${project.mc_version}-${project.mod_version}"
group = "com.davigj"

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
minecraft.accessTransformers.file rootProject.file("src/main/resources/META-INF/accesstransformer.cfg")

runs {
    configureEach {
        systemProperty "forge.logging.markers", "REGISTRIES"
        systemProperty "forge.logging.console.level", "debug"
    }
    client {
        modSources {
            add project.sourceSets.main
        }
    }
    server {
        modSources {
            add project.sourceSets.main
        }
    }
    data {
        modSources {
            add project.sourceSets.main
        }
        arguments.addAll "--mod", project.mod_id, "--all", "--output", file("src/generated/resources/").getAbsolutePath(), "--existing",
                file("src/main/resources").getAbsolutePath(),
                "--existing-mod", "blueprint"
    }
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neoforge}"
    implementation "maven.modrinth:blueprint:YSWV62mG"

    compileOnly "maven.modrinth:citadel:ssXkoBKk"
    compileOnly "maven.modrinth:alexs-mobs:oaRqJ7uM"
    compileOnly "maven.modrinth:artsandcrafts:aYBUh5gU"
    compileOnly "maven.modrinth:supplementaries:8fif4M3b"
    compileOnly "maven.modrinth:moonlight:BPcfgWEU"
    compileOnly "maven.modrinth:sullysmod:B9yOFBhf"
    compileOnly "maven.modrinth:atmospheric:wFKEIHk8"
    compileOnly "maven.modrinth:autumnity:dNSKgdoR"
    compileOnly "maven.modrinth:environmental:NdDV1AM8"
    compileOnly "maven.modrinth:visuality-forge:MyhpSYT4"
    compileOnly "maven.modrinth:species:6ZvnLcTh"
    compileOnly "maven.modrinth:no-mans-land:h56TqJQD"
    compileOnly "maven.modrinth:biolith:byVGeYWw"

//    runtimeOnly "maven.modrinth:citadel:ssXkoBKk")
//    runtimeOnly "maven.modrinth:alexs-mobs:oaRqJ7uM")
//    runtimeOnly "maven.modrinth:artsandcrafts:aYBUh5gU"
//    runtimeOnly "maven.modrinth:atmospheric:wFKEIHk8")
//    runtimeOnly "maven.modrinth:autumnity:dNSKgdoR")
    runtimeOnly "maven.modrinth:environmental:NdDV1AM8"
    runtimeOnly "maven.modrinth:just-dandy:tyeKnppe"
    runtimeOnly "maven.modrinth:no-mans-land:h56TqJQD"
    runtimeOnly "maven.modrinth:biolith:byVGeYWw"
    runtimeOnly "maven.modrinth:moonlight:86D1JAu2"
    runtimeOnly "maven.modrinth:supplementaries:rEEPz2OX"
//    runtimeOnly "maven.modrinth:sullysmod:B9yOFBhf")

    compileOnly("mezz.jei:jei-${project.mc_version}-neoforge-api:${project.jei}")
    runtimeOnly("mezz.jei:jei-${project.mc_version}-neoforge:${project.jei}")
}

subsystems {
    parchment {
        minecraftVersion = "${project.mc_version}"
        mappingsVersion = "${project.parchment}"
    }
}

repositories {
    maven { url "https://maven.teamabnormals.com/" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://modmaven.dev" }
    maven {
        url = "https://maven.teamabnormals.com"
    }
    maven {
        url = "https://api.modrinth.com/maven"
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [mod_version: mod_version, mc_version: mc_version, neoforge: neoforge, blueprint: blueprint]
    inputs.properties replaceProperties
    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand replaceProperties
    }
}

tasks.named("jar", Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : project.mod_name,
                "Specification-Vendor"    : "DavigJ",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.mod_name,
                "Implementation-Version"  : project.mod_version,
                "Implementation-Vendor"   : "DavigJ",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}